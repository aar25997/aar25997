# Decap CMS configuration: the editing screens for content/.
# Saving in the CMS commits to the repository; the host then rebuilds the site.
# Setup steps are in docs/HANDOFF.md ("Content editing").

backend:
  # Use "git-gateway" on Netlify (with Netlify Identity), or "github" with an OAuth app.
  name: github
  repo: NEFRA-OWNER/nefra-website   # replace with the NEFRA-owned repository
  branch: main

# Run `npx decap-server` alongside `npm run preview` to edit locally without logging in.
local_backend: true

media_folder: src/assets/img/uploads
public_folder: /assets/img/uploads
site_url: https://YOUR-DOMAIN.com
display_url: https://YOUR-DOMAIN.com

collections:
  # ---------------------------------------------------------------- Locations
  - name: locations
    label: Locations
    files:
      - name: locations
        label: All locations
        file: content/locations.json
        fields:
          - name: locations
            label: Locations
            label_singular: Location
            widget: list
            summary: "{{fields.address.city}} ({{fields.status}})"
            fields:
              - { name: slug, label: "URL slug", hint: "Lowercase, no spaces. Page will be /locations/<slug>/. Don't change after launch.", widget: string }
              - { name: name, label: "Business name", hint: "Match the Google Business Profile name exactly.", widget: string, default: "NEFRA" }
              - name: status
                label: Status
                widget: select
                options: [{ label: "Coming soon", value: "coming-soon" }, { label: "Open", value: "open" }, { label: "Temporarily closed", value: "temporarily-closed" }]
                default: coming-soon
              - { name: openingNote, label: "Coming-soon message", widget: text, required: false }
              - name: address
                label: Address
                widget: object
                fields:
                  - { name: street, label: Street, widget: string, required: false }
                  - { name: city, label: City, widget: string }
                  - { name: region, label: "State (abbr.)", widget: string, default: "VA" }
                  - { name: regionName, label: "State (full)", widget: string, default: "Virginia" }
                  - { name: postalCode, label: "ZIP", widget: string, required: false }
              - name: coordinates
                label: Coordinates
                hint: "From Google Maps: right-click the pin and copy the numbers."
                widget: object
                required: false
                fields:
                  - { name: lat, label: Latitude, widget: number, value_type: float, required: false }
                  - { name: lng, label: Longitude, widget: number, value_type: float, required: false }
              - { name: googlePlaceId, label: "Google Place ID", hint: "Optional. Makes Get Directions open the exact Business Profile.", widget: string, required: false }
              - { name: mapsUrl, label: "Custom directions link", hint: "Optional override for Get Directions.", widget: string, required: false }
              - { name: phone, label: Phone, widget: string, required: false }
              - { name: orderUrl, label: "Online ordering link", hint: "This location's page on the ordering provider (Toast, Clover, SpotOn...). Used only when status is Open.", widget: string, required: false }
              - { name: hoursConfirmed, label: "Hours confirmed", hint: "Leave off until hours are final. Hours are hidden on the site and in Google data until this is on.", widget: boolean, default: false }
              - name: hours
                label: Hours
                widget: list
                summary: "{{fields.opens}}–{{fields.closes}}"
                fields:
                  - { name: days, label: Days, widget: select, multiple: true, options: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday] }
                  - { name: opens, label: "Opens (24h, e.g. 11:00)", widget: string, pattern: ['^([01]\d|2[0-3]):[0-5]\d$', "Use HH:MM, e.g. 11:00"], required: false }
                  - { name: closes, label: "Closes (24h, e.g. 21:30)", widget: string, pattern: ['^([01]\d|2[0-4]):[0-5]\d$', "Use HH:MM, e.g. 21:30"], required: false }
              - { name: parking, label: Parking, widget: text, required: false }
              - { name: menuNote, label: "Menu note", hint: "E.g. items not available at this location.", widget: text, required: false }
              - name: photos
                label: Photos
                widget: list
                required: false
                fields:
                  - { name: src, label: Image, widget: image }
                  - { name: alt, label: "Alt text", hint: "Describe the photo for people who can't see it.", widget: string }
              - name: seo
                label: SEO
                widget: object
                fields:
                  - { name: title, label: "Page title", widget: string, required: false }
                  - { name: description, label: "Meta description", widget: text, required: false }

  # ---------------------------------------------------------------- Menu
  - name: menu
    label: Menu
    files:
      - name: menu
        label: Menu
        file: content/menu.json
        fields:
          - { name: disclaimer, label: "Allergen disclaimer", widget: text }
          - name: categories
            label: Categories
            label_singular: Category
            widget: list
            summary: "{{fields.order}}. {{fields.name}}"
            fields:
              - { name: id, label: "ID", hint: "Short lowercase id used in links, e.g. shawarma. Don't change after launch.", widget: string }
              - { name: name, label: Name, widget: string }
              - { name: description, label: Description, widget: string, required: false }
              - { name: order, label: "Display order", widget: number, value_type: int }
          - name: items
            label: Items
            label_singular: Item
            widget: list
            summary: "{{fields.name}} ({{fields.category}})"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: category, label: "Category", widget: relation, collection: menu, file: menu, search_fields: ["categories.*.name"], display_fields: ["categories.*.name"], value_field: "categories.*.id" }
              - { name: description, label: Description, widget: text, required: false }
              - { name: price, label: "Price (USD)", hint: "Leave empty to show 'Price coming soon'. Keep in sync with the POS.", widget: number, value_type: float, required: false }
              - { name: image, label: Photo, widget: image, required: false }
              - { name: alt, label: "Photo alt text", widget: string, required: false }
              - { name: allergens, label: "Allergens", hint: "Only verified allergens, e.g. Sesame, Wheat.", widget: list, required: false }
              - { name: dietary, label: "Dietary tags", hint: "Only verified tags, e.g. Vegetarian.", widget: list, required: false }
              - { name: available, label: "Available", widget: boolean, default: true }
              - { name: locations, label: "Only at these locations", hint: "Leave empty if served everywhere. Use location slugs.", widget: list, required: false }
              - { name: orderUrl, label: "Item ordering link", hint: "Optional deep link to this item on the ordering provider.", widget: string, required: false }
          - name: featured
            label: "Homepage featured cards"
            widget: list
            max: 4
            fields:
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text }
              - { name: category, label: "Links to category", widget: relation, collection: menu, file: menu, search_fields: ["categories.*.name"], display_fields: ["categories.*.name"], value_field: "categories.*.id" }
              - { name: image, label: Photo, widget: image, required: false }
              - { name: alt, label: "Photo alt text", widget: string }

  # ---------------------------------------------------------------- Brand stories
  - name: stories
    label: Brand stories
    label_singular: Story
    folder: content/stories
    create: true
    extension: md
    format: json-frontmatter
    frontmatter_delimiter: "---"
    slug: "{{slug}}"
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: path, label: "URL path", hint: "Optional, e.g. /our-story/. Defaults to /stories/<file name>/.", widget: string, required: false }
      - { name: eyebrow, label: "Label above heading", widget: string, required: false }
      - { name: heading, label: "Page heading", widget: string }
      - { name: lead, label: "Intro line", widget: text, required: false }
      - { name: heroImage, label: "Header photo", widget: image, required: false }
      - { name: heroAlt, label: "Header photo alt text", widget: string, required: false }
      - { name: body, label: "Story", widget: markdown, buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list], editor_components: [image] }
      - { name: seoTitle, label: "SEO title", widget: string, required: false }
      - { name: seoDescription, label: "SEO description", widget: text, required: false }
      - { name: dropcap, label: "Decorative first letter", widget: boolean, default: false }
      - { name: order, label: "Order", widget: number, value_type: int, default: 10 }
      - { name: published, label: Published, widget: boolean, default: false }

  # ---------------------------------------------------------------- Events & updates
  - name: events
    label: Events & updates
    label_singular: Event or update
    folder: content/events
    create: true
    extension: md
    format: json-frontmatter
    frontmatter_delimiter: "---"
    slug: "{{year}}-{{month}}-{{slug}}"
    summary: "{{date}} · {{title}} ({{status}})"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: type, label: Type, widget: select, options: [{ label: Event, value: event }, { label: "News / update", value: update }], default: update }
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: endDate, label: "End date (events)", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false }
      - { name: summary, label: Summary, widget: text }
      - { name: image, label: Image, widget: image, required: false }
      - { name: alt, label: "Image alt text", widget: string, required: false }
      - { name: location, label: "Location slug", widget: string, required: false, default: sterling }
      - { name: status, label: Status, widget: select, options: [draft, published], default: draft }
      - { name: body, label: Details, widget: markdown }

  # ---------------------------------------------------------------- Settings
  - name: settings
    label: Site settings
    files:
      - name: site
        label: "General, contact & social"
        file: content/site.json
        fields:
          - { name: name, label: "Brand name", widget: string }
          - { name: tagline, label: Tagline, widget: string }
          - { name: subTagline, label: "Supporting line", widget: string }
          - { name: description, label: "Default meta description", widget: text }
          - { name: cuisines, label: "Cuisines (structured data)", widget: list }
          - { name: siteUrl, label: "Site URL", hint: "e.g. https://www.nefrahouse.com, no trailing slash", widget: string, required: false }
          - { name: basePath, label: "Base path", widget: hidden, default: "/" }
          - { name: logo, label: "Logo (official wordmark SVG)", widget: image, required: false }
          - { name: email, label: Email, widget: string, required: false }
          - { name: phone, label: Phone, widget: string, required: false }
          - name: social
            label: Social links
            widget: list
            fields:
              - { name: network, label: Network, widget: string }
              - { name: handle, label: Handle, widget: string, required: false }
              - { name: url, label: URL, widget: string }
          - name: navigation
            label: Main navigation
            widget: list
            fields: [{ name: label, label: Label, widget: string }, { name: path, label: Path, widget: string }]
          - name: footerLinks
            label: Footer links
            widget: list
            fields: [{ name: label, label: Label, widget: string }, { name: path, label: Path, widget: string }]
          - { name: newsletterEndpoint, label: "Newsletter form endpoint", hint: "POST URL from your email provider or form service.", widget: string, required: false }
          - { name: contactEndpoint, label: "Contact form endpoint", widget: string, required: false }
          - { name: cateringEnabled, label: "Show catering page", widget: boolean, default: false }
          - name: analytics
            label: Analytics & Search Console
            widget: object
            fields:
              - { name: ga4MeasurementId, label: "GA4 Measurement ID (G-XXXX)", widget: string, required: false }
              - { name: googleSiteVerification, label: "Search Console verification code", widget: string, required: false }
          - name: images
            label: Homepage photos
            widget: object
            fields:
              - { name: philosophy, label: "Philosophy section (ingredients close-up)", widget: object, fields: [{ name: src, label: Image, widget: image, required: false }, { name: alt, label: "Alt text", widget: string, required: false }] }
              - { name: story, label: "Story section (craft / hands)", widget: object, fields: [{ name: src, label: Image, widget: image, required: false }, { name: alt, label: "Alt text", widget: string, required: false }] }
          - name: hero
            label: Homepage hero
            widget: object
            fields:
              - { name: image, label: Image, widget: image, required: false }
              - { name: imageAlt, label: "Image alt text", widget: string, required: false }
              - { name: video, label: "Muted video (mp4, optional)", widget: file, required: false }
              - { name: poster, label: "Video poster image", widget: image, required: false }
      - name: ordering
        label: "Online ordering"
        file: content/ordering.json
        fields:
          - { name: provider, label: "Provider", widget: select, options: ["", toast, clover, spoton, other], required: false }
          - name: mode
            label: Mode
            hint: "Link (recommended) sends guests to the provider's ordering page. Embed shows it inside /order/."
            widget: select
            options: [{ label: "Link (recommended)", value: link }, { label: "Embed", value: embed }]
            default: link
          - { name: defaultUrl, label: "Default ordering link", hint: "Used for open locations without their own link.", widget: string, required: false }
          - { name: openInNewTab, label: "Open ordering in a new tab", widget: boolean, default: false }
          - { name: trackingParams, label: "Tracking parameters", widget: string, required: false }
          - { name: cateringUrl, label: "Catering ordering link", widget: string, required: false }
          - { name: giftCardsUrl, label: "Gift cards link", widget: string, required: false }
          - { name: familyMealsUrl, label: "Family meals link", widget: string, required: false }
      - name: social
        label: "Instagram highlights"
        file: content/social.json
        fields:
          - name: posts
            label: Posts
            widget: list
            max: 8
            fields:
              - { name: image, label: Image, widget: image }
              - { name: alt, label: "Alt text", widget: string }
              - { name: url, label: "Instagram post link", widget: string }
